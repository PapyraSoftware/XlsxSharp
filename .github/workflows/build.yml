name: Build & Test

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build & Test
    runs-on: ${{ matrix.os }}

    env:
      # SixLabors.Fonts 3.x refuses to compile without a license. Directory.Build.props picks this up
      # via the SixLaborsLicenseKey property when GITHUB_ACTIONS is set.
      SIXLABORS_LICENSE_KEY: ${{ secrets.SIXLABORS_LICENSE_KEY }}

    strategy:
      # Keep the other platforms running so a single OS-specific failure
      # still tells us the state of the rest.
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Restore dependencies
        run: dotnet restore XlsxSharp.slnx

      - name: Build
        run: dotnet build XlsxSharp.slnx --configuration Release --no-restore

      - name: Test
        run: >
          dotnet test XlsxSharp.slnx --configuration Release --no-build
          --logger "trx;LogFileName=test-results.trx"
          --results-directory TestResults

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults/
          if-no-files-found: ignore
